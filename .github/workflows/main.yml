name: Build Maa APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir android
          unzip -q MaaApp_With_Image.zip -d android

      - name: Build APK
        run: |
          PROJECT=$(find android -name gradlew -type f | head -1 | xargs dirname)
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maa-APK
          path: android/**/app/build/outputs/apk/debug/*.apk
